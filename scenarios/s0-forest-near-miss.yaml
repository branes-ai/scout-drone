# The docs site's replay of a near miss (docs/guides/forest-replay.mdx):
# s0-forest at seed 1710, where s0-gt-pid passes close to a trunk and
# reaches the goal. tools/gen_replay.sh records it.
name: s0-forest-near-miss
field: ../fields/forest-60.yaml
vehicle: ../vehicles/rp1.yaml
duration_s: 30
seed: 1710
randomization:
  mass: 0.05
  inertia: 0.1
  drag: 0.1
  motor_time_constant: 0.1
  start_xy_m: 0.2
  start_yaw_rad: 0.05
sim:
  oracle_range_m: 10.0
  oracle_sigma_m: 0.05
  collision_radius_m: 0.25
