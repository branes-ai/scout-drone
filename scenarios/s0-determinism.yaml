# S0's determinism run (docs/plan/bring-up/, acceptance 3): s0-gt-pid on a
# grown forest with every random stream in use (the randomization, the IMU,
# the camera corruption, the oracle's noise). Two runs from the same seed
# write byte-identical logs, and a replay reproduces every output.
name: s0-determinism
field: ../fields/forest-60.yaml
vehicle: ../vehicles/rp1.yaml
duration_s: 8
seed: 1700
randomization:
  mass: 0.05
  inertia: 0.1
  drag: 0.1
  motor_time_constant: 0.1
  start_xy_m: 0.2
  start_yaw_rad: 0.05
faults:
  - {type: camera_corrupt, t_s: 0.0, probability: 0.25}
sim:
  oracle_range_m: 10.0
  oracle_sigma_m: 0.05
